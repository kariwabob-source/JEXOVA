<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b10">
  <title>Dashboard  |  JEXOVA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e0b15a'/%3E%3Cpath d='M6 22l6-8 5 4 9-10' fill='none' stroke='%231a1408' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- React renders the existing prototype UI and reads its bundled sample snapshot. -->
</head>
<body>
  <div id="root">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 16l5-6 4 3 7-8"></path><path d="M4 20h16"></path></svg>
        </span>
        <span>
          <span class="brand-name">JEXOVA</span>
          <span class=" brand-tag">Personal journal</span>
        </span>
      </a>

      <nav class="nav" aria-label="Primary">
        <p class="nav-label">Menu</p>
        <a class="nav-link" href="#dashboard" data-page="dashboard">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"></rect><rect x="13" y="3" width="8" height="5" rx="1.5"></rect><rect x="13" y="10" width="8" height="11" rx="1.5"></rect><rect x="3" y="13" width="8" height="8" rx="1.5"></rect></svg>
          Dashboard
        </a>
        <a class="nav-link" href="#journal" data-page="journal">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"></path><path d="M4 6h.01M4 12h.01M4 18h.01"></path></svg>
          Trade Journal
        </a>
        <a class="nav-link" href="#calendar" data-page="calendar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
          Calendar
        </a>
        <a class="nav-link" href="#analytics" data-page="analytics">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V10M10 19V5M16 19v-7M22 19H2"></path></svg>
          Analytics
        </a>
        <a class="nav-link" href="#strategies" data-page="strategies">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"></path><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"></path></svg>
          Strategies
        </a>
        <a class="nav-link" href="#settings" data-page="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"></path></svg>
          Settings
        </a>
      </nav>

      <div class="sidebar-foot">
        <strong>Sample account</strong>
        <span>MT5 sync comes later</span>
      </div>
    </aside>

    <button class="backdrop" id="backdrop" type="button" aria-label="Close navigation"></button>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn" id="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
          </button>
          <div>
            <h1 id="page-title" tabindex="-1">Dashboard</h1>
            <p id="page-subtitle">Performance overview</p>
          </div>
        </div>
        <div class="topbar-right">
          <div class="equity-pill">
            <span>Equity</span>
            <strong id="equity-value">-</strong>
          </div>
          <div class="sync-pill" title="This prototype uses sample trades bundled in the page.">
            <span class="dot" aria-hidden="true"></span>
            Sample data
          </div>
        </div>
      </header>

      <main class="content" id="view">
        <p class="loading">Loading your journal...</p>
      </main>
    </div>
  </div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
